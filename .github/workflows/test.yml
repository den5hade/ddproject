name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    name: Python tests (uv workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.3"
      - run: uv sync --all-packages --frozen
      - run: uv run --all-packages pytest apps tests

  web:
    name: Web lint · unit · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: Web E2E (Playwright vs real stack)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      # Dev-only credentials; backend refuses them only in APP_ENV=production.
      DATABASE_URL: postgresql+asyncpg://pdf:pdf123@localhost:5432/pdf_platform
      RABBITMQ_URL: amqp://pdf:pdf123@localhost:5672/
      JWT_SECRET_KEY: ci-secret-key-0123456789abcdef-0123456789abcdef
      AUTH_HMAC_KEY: ci-hmac-key-0123456789abcdef-0123456789abcdef
      AUTH_OTP_PEPPER: ci-otp-pepper-0123456789abcdef-0123456789abcdef
      AUTH_PIN_PEPPER: ci-pin-pepper-0123456789abcdef-0123456789abcdef
      REDIS_CONTAINER: ${{ job.services.redis.id }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdf
          POSTGRES_PASSWORD: pdf123
          POSTGRES_DB: pdf_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdf -d pdf_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: pdf
          RABBITMQ_DEFAULT_PASS: pdf123
        ports:
          - 5672:5672
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.3"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python workspace + migrate DB
        run: |
          uv sync --all-packages --frozen
          uv run --all-packages alembic -c alembic.ini upgrade head

      - name: Start account-api
        run: |
          uv run --all-packages uvicorn app.main:app \
            --app-dir apps/account-api --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/api/v1/auth/me -o /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/openapi.json > /dev/null

      - name: Install web deps + chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7
