# Local development stack: postgres, rabbitmq, redis + the app services
# (account-api with uvicorn --reload, notification-worker, objectstorage-worker).
#   make compose-dev
# Dev-only credentials default below; override via infrastructure/development/.env
# (copy from .env.example). Never reuse these in production.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdf123}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdf} -d ${POSTGRES_DB:-pdf_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pdf}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pdf123}
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # OTP store, rate limiting

  db-migrate:
    build:
      context: ../..
      dockerfile: apps/account-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pdf}:${POSTGRES_PASSWORD:-pdf123}@postgres:5432/${POSTGRES_DB:-pdf_platform}
    working_dir: /app
    volumes:
      - ../../alembic.ini:/app/alembic.ini:ro
      - ../../migrations:/app/migrations:ro
    command: ["/app/.venv/bin/python", "-m", "alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  account-api:
    build:
      context: ../..
      dockerfile: apps/account-api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pdf}:${POSTGRES_PASSWORD:-pdf123}@postgres:5432/${POSTGRES_DB:-pdf_platform}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pdf}:${RABBITMQ_PASSWORD:-pdf123}@rabbitmq:5672/
      STORAGE_TEMP_DIR: /app/uploads
    ports:
      - "8000:8000" # API: http://localhost:8000
    volumes:
      - ../../apps/account-api/app:/app/apps/account-api/app
      - uploads:/app/uploads
    command: ["uv", "run", "--no-project", "uvicorn", "app.main:app", "--reload", "--reload-dir", "app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification-worker:
    build:
      context: ../..
      dockerfile: apps/notification-worker/Dockerfile
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pdf}:${RABBITMQ_PASSWORD:-pdf123}@rabbitmq:5672/
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  objectstorage-worker:
    build:
      context: ../..
      dockerfile: apps/objectstorage-worker/Dockerfile
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-pdf}:${RABBITMQ_PASSWORD:-pdf123}@rabbitmq:5672/
      STORAGE_TEMP_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  uploads: