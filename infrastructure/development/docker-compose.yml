# Local development stack: mirrors the production layout with a local RabbitMQ.
#   docker compose -f infrastructure/development/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pdf
      POSTGRES_PASSWORD: pdf123
      POSTGRES_DB: pdf_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pdf
      RABBITMQ_DEFAULT_PASS: pdf123
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - miniodata:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  miniodata:
  qdrantdata:
