# Main VPS: nginx (web SPA + reverse proxy), account-api, marker-orchestrator,
# ai-worker, PostgreSQL, Qdrant. RabbitMQ runs on its OWN VPS (infrastructure/rabbitmq-vps)
# and is reached over the Tailscale/WireGuard overlay network via RABBITMQ_URL.
# Build context for the Python images is the monorepo root.

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - web-dist:/usr/share/nginx/html:ro
    depends_on:
      - account-api

  account-api:
    build:
      context: ../..
      dockerfile: apps/account-api/Dockerfile
    env_file: .env
    expose:
      - "8000"
    depends_on:
      - postgres

  marker-orchestrator:
    build:
      context: ../..
      dockerfile: apps/marker-orchestrator/Dockerfile
    env_file: .env
    depends_on:
      - postgres

  ai-worker:
    build:
      context: ../..
      dockerfile: apps/ai-worker/Dockerfile
    env_file: .env
    depends_on:
      - qdrant

  notification-worker:
    build:
      context: ../..
      dockerfile: apps/notification-worker/Dockerfile
    env_file: .env
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrantdata:/qdrant/storage

volumes:
  pgdata:
  qdrantdata:
  web-dist:
