events {}

http {
  # SPA static files are baked into the "web-dist" volume by the web pipeline;
  # /api/* is reverse-proxied to account-api so the app stays same-origin (no CORS).

  server {
    listen 80;
    server_name _;

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location /api/ {
      proxy_pass http://account-api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
