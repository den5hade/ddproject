[project]
name = "account-api"
version = "0.1.0"
description = "User cabinet API: registration, auth, PDF upload, job status."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt>=2.8",
    "redis>=5.0",
    "pdf-contracts",
    "pdf-messaging",
    "pdf-storage",
    "pdf-observability",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "fakeredis>=2.23",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs live Postgres/Redis/RabbitMQ (docker compose)",
]
