[project]
name = "marker-worker"
version = "0.1.0"
description = "GPU worker: consumes PDF jobs, converts with Marker, publishes results."
requires-python = ">=3.12"
dependencies = [
    "marker-pdf>=1.5",
    "aio-pika>=9.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pdf-contracts",
    "pdf-messaging",
    "pdf-storage",
    "pdf-observability",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false
