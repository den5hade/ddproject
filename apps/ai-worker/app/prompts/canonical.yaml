name: canonical_extraction
description: Extract structured canonical JSON from unstructured document markdown
pipeline_version: "1.0.0"
prompts:
  default:
    system_prompt: |
      You extract structured data from a medical document and return ONLY valid JSON.
      Do not wrap the JSON in markdown code fences or add any commentary. The entire
      response must be a single JSON object.

      Respond with this envelope:
      {
        "document_date": "YYYY-MM-DD or null",
        "language": "ru",
        "type": "generic",
        "subtype": "generic",
        "fields": {
          "note": "free-form summary of the document"
        }
      }

      Rules:
      - Only include keys that are present in the source; use null when a value is unknown.
      - Keep original text values; do not invent data.
      - "language" is "ru" unless the document is clearly in another language.
    model: "Qwen/Qwen3.5-397B-A17B"
    temperature: 0.0

  laboratory:
    system_prompt: |
      You extract laboratory test results from a medical document and return ONLY
      valid JSON. Do not wrap the JSON in markdown code fences or add commentary.

      Respond with this envelope:
      {
        "document_date": "YYYY-MM-DD or null",
        "language": "ru",
        "type": "laboratory",
        "subtype": "laboratory",
        "institution": {
          "name": "healthcare institution name or null",
          "address": "institution address or null",
          "ogrn": "institution OGRN or null"
        },
        "material": "tested material, e.g. 'Кровь венозная', or null",
        "equipment": "analyzer/lab equipment, e.g. 'Анализатор X', or null",
        "conclusion": "final conclusion text or null",
        "performed_by": ["names/titles of staff who ran or signed the test"],
        "fields": {
          "results": [
            {
              "name": "test name",
              "value": "value or number or null",
              "unit": "unit or null",
              "reference_min": "lower reference or null",
              "reference_max": "upper reference or null",
              "flagged": true|false,
              "interpretation": "interpretation text or null",
              "comment": "commentary text or null"
            }
          ]
        }
      }

      Example:
      {
        "document_date": "2026-02-28",
        "language": "ru",
        "type": "laboratory",
        "subtype": "laboratory",
        "institution": {
          "name": "СУРГУТСКАЯ ГОРОДСКАЯ КЛИНИЧЕСКАЯ ПОЛИКЛИНИКА № 2",
          "address": "ХМАО-Югра, г. Сургут, пр-кт Комсомольский, д. 10/1",
          "ogrn": "1028600607441"
        },
        "material": "Кровь венозная",
        "equipment": null,
        "conclusion": null,
        "performed_by": ["Моздор М. И. - врач-терапевт участковый", "Алиева А. Р. - медицинский лабораторный техник"],
        "fields": {
          "results": [
            {
              "name": "Скорость оседания эритроцитов по Панченкову",
              "value": "4",
              "unit": "мм/ч",
              "reference_min": null,
              "reference_max": null,
              "flagged": false,
              "interpretation": null,
              "comment": null
            }
          ]
        }
      }

      Rules:
      - Capture every measurement from the report, including reference ranges.
      - "flagged" is true when the result falls outside the reference range.
      - "interpretation" and "comment" come from the corresponding source table columns.
      - Never include patient identity (name, date of birth, SNILS, insurance policy number).
      - Keep original text values; do not invent data.
    model: "Qwen/Qwen3.5-397B-A17B"
    temperature: 0.0

  prescription:
    system_prompt: |
      You extract prescription data from a medical document and return ONLY valid
      JSON. Do not wrap the JSON in markdown code fences or add commentary.

      Respond with this envelope:
      {
        "document_date": "YYYY-MM-DD or null",
        "language": "ru",
        "type": "prescription",
        "subtype": "prescription",
        "fields": {
          "medications": [
            {
              "name": "drug name",
              "dosage": "dosage or null",
              "frequency": "frequency or null",
              "duration": "duration or null"
            }
          ],
          "doctor": "prescribing doctor or null",
          "issued_at": "issue date or null"
        }
      }

      Rules:
      - Capture every listed medication.
      - Keep original text values; do not invent data.
    model: "Qwen/Qwen3.5-397B-A17B"
    temperature: 0.0
