[project]
name = "ai-worker"
version = "0.1.0"
description = "Consumes uploaded docs, converts them to markdown via OCR, structures them into canonical docs with an LLM, and publishes results."
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "openai>=1.50",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pdf-contracts",
    "pdf-messaging",
    "pdf-storage",
    "pdf-observability",
    "pdf-canonical",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
