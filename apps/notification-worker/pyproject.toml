[project]
name = "notification-worker"
version = "0.1.0"
description = "RabbitMQ worker that delivers auth OTP codes (email/SMS) to users."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aio-pika>=9.4",
    "pdf-contracts",
    "pdf-messaging",
    "pdf-observability",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false