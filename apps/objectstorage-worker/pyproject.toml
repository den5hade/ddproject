[project]
name = "objectstorage-worker"
version = "0.1.0"
description = "RabbitMQ worker that normalizes, validates and uploads staged files to S3."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "aio-pika>=9.4",
    "pdf-contracts",
    "pdf-messaging",
    "pdf-storage",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]