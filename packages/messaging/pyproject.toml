[project]
name = "pdf-messaging"
version = "0.1.0"
description = "RabbitMQ helpers: declaring queues, publishing, consuming, retries."
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pdf-contracts",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["messaging"]