[project]
name = "pdf-canonical"
version = "0.1.0"
description = "Canonical extraction schema registry, validation and deterministic markdown rendering."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["canonical"]
