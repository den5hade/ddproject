[project]
name = "pdf-storage"
version = "0.1.0"
description = "S3-compatible helpers: download, upload, presigned URLs."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "botocore>=1.35",
    "pydantic-settings>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["storage"]