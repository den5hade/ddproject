[project]
name = "pdf-contracts"
version = "0.1.0"
description = "Shared event contracts and schemas for the PDF pipeline."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]